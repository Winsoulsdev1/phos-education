<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchoolOS — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #EFF3FF; margin: 0; padding: 20px; }
  .card { max-width: 400px; margin: 70px auto 0; background: #FFFFFF; border: 1px solid #DCE6FA; padding: 26px; border-radius: 6px; box-shadow: 0 1px 4px rgba(27,42,63,0.08); }
  h1 { font-size: 20px; color: #2D6CDF; margin-top: 0; }
  label { display: block; font-size: 13px; margin: 14px 0 4px; color: #1E293B; }
  input { width: 100%; padding: 9px; border: 1px solid #DCE6FA; border-radius: 4px; font-size: 14px; }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 60px; }
  .toggle-eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #2D6CDF; font-size: 12px; cursor: pointer; padding: 4px 6px;
  }
  button.primary { margin-top: 20px; width: 100%; padding: 10px; background: #2D6CDF; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
  #message { margin-top: 14px; font-size: 13px; padding: 10px; border-radius: 4px; display: none; }
  #message.success { background: #E3EEFF; color: #2D6CDF; display: block; }
  #message.error { background: #FDE8E8; color: #EF4444; display: block; }
</style>
</head>
<body>
 
<div class="card">
  <h1>Set a New Password</h1>
  <label>New password</label>
  <div class="password-wrap">
    <input id="new_password" type="password" placeholder="At least 6 characters">
    <button type="button" class="toggle-eye" onclick="toggleEye('new_password', this)">Show</button>
  </div>
  <button class="primary" id="resetBtn" onclick="resetPassword()">Set New Password</button>
  <div id="message"></div>
</div>
 
<script>
  const SUPABASE_URL = "https://rodbwktwbjynjsupfsvn.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvZGJ3a3R3Ymp5bmpzdXBmc3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDU1MTgsImV4cCI6MjEwNDE4MTUxOH0.K7C4k7FyN0hlniV51r6JQbzs_OObHFqXaShOxz6iGLs";
 
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
  // When someone arrives here via the emailed reset link, Supabase
  // automatically reads the recovery token from the URL and starts a
  // temporary session — that's what lets updateUser() below work.
 
  function toggleEye(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Hide'; }
    else { input.type = 'password'; btn.textContent = 'Show'; }
  }
 
  async function resetPassword() {
    const newPassword = document.getElementById('new_password').value;
    const msg = document.getElementById('message');
    const btn = document.getElementById('resetBtn');
 
    if (!newPassword || newPassword.length < 6) {
      msg.className = 'error';
      msg.textContent = 'Password must be at least 6 characters.';
      return;
    }
 
    btn.disabled = true;
    btn.textContent = 'Saving…';
 
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
 
    btn.disabled = false;
    btn.textContent = 'Set New Password';
 
    if (error) {
      msg.className = 'error';
      msg.textContent = 'Error: ' + error.message;
    } else {
      msg.className = 'success';
      msg.textContent = 'Password updated! You can now log in with your new password.';
    }
  }
</script>
 
</body>
</html>
