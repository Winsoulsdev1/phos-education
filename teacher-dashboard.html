<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchoolOS — Teacher Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E293B; --ink-soft: #64748B; --teal: #2D6CDF; --teal-tint: #E3EEFF;
    --gold: #FFB020; --sage: #22A06B; --sage-tint: #E1F8ED;
    --red: #EF4444; --red-tint: #FDE8E8; --paper: #FFFFFF; --page-bg: #EFF3FF; --border: #DCE6FA; --sidebar-color: #2D6CDF;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", -apple-system, sans-serif; margin: 0; background: var(--page-bg); color: var(--ink); font-size: 14px; line-height: 1.5; }
  .app { display: flex; min-height: 100vh; }
 
  .sidebar { width: 210px; background: var(--sidebar-color); color: #DCEAE6; flex-shrink: 0; padding: 18px 0; }
  .brand { font-weight: 700; font-size: 14px; color: #FBFAF5; padding: 0 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 8px; letter-spacing: 0.2px; }
  .nav-item { display: block; padding: 10px 20px; font-size: 13px; color: #B9D3CB; text-decoration: none; border-left: 3px solid transparent; }
  .nav-item:hover { background: rgba(255,255,255,0.05); }
  .nav-item.active { background: rgba(255,255,255,0.08); border-left-color: var(--gold); color: #FBFAF5; font-weight: 600; }
  .logout-item { display: block; padding: 10px 20px; font-size: 12.5px; color: #E3A9A9; cursor: pointer; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
 
  .main { flex: 1; padding: 36px 40px; max-width: 640px; }
  .card { background: var(--paper); border-radius: 8px; padding: 28px 30px; box-shadow: 0 1px 3px rgba(22,40,58,0.06); border: 1px solid var(--border); }
 
  .profile-header { display: flex; align-items: center; gap: 20px; padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
  .photo-block { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .photo-circle { position: relative; width: 76px; height: 76px; border-radius: 50%; background: var(--gold); color: #2B2109; font-weight: 700; font-size: 24px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; transition: opacity 0.15s ease; }
  .photo-circle:hover { opacity: 0.85; }
  .photo-circle img { width: 100%; height: 100%; object-fit: cover; }
  .photo-edit-badge { position: absolute; bottom: -1px; right: -1px; width: 22px; height: 22px; border-radius: 50%; background: var(--teal); color: var(--paper); font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--paper); }
  .photo-caption { font-size: 10.5px; color: var(--ink-soft); margin-top: 6px; text-align: center; }
  #photoMsg { font-size: 10.5px; color: var(--sage); margin-top: 2px; text-align: center; min-height: 13px; }
 
  .profile-info h1 { font-weight: 700; font-size: 21px; color: var(--ink); margin: 0 0 4px; }
  .profile-meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
  .subject-tag { display: inline-block; background: var(--teal-tint); color: var(--teal); font-size: 12px; font-weight: 500; padding: 3px 11px; border-radius: 12px; margin: 2px 5px 2px 0; }
 
  .field-grid { display: grid; grid-template-columns: 90px 1fr; row-gap: 12px; font-size: 14px; }
  .field-grid strong { color: var(--ink-soft); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; }
 
  #loading, #notLoggedIn { text-align: center; color: var(--ink-soft); padding: 60px 0; }
</style>
</head>
<body>
 
<div class="app">
  <div class="sidebar" id="sidebarEl">
    <div class="brand">SchoolOS</div>
    <a class="nav-item active" href="teacher-dashboard.html">Dashboard</a>
    <a class="nav-item" href="students.html">Students</a>
    <a class="nav-item" href="assessments.html">Assessments</a>
    <a class="nav-item" href="settings.html">Settings</a>
    <div class="logout-item" onclick="logout()">Log Out</div>
  </div>
 
  <div class="main">
    <div id="loading">Loading your account…</div>
    <div id="notLoggedIn" style="display:none;" class="card">
      You're not logged in. <a href="login.html">Go to login</a>
    </div>
 
    <div id="content" style="display:none;" class="card">
      <div class="profile-header">
        <div class="photo-block">
          <div class="photo-circle" id="photoCircle" onclick="document.getElementById('photoFile').click()"></div>
          <input type="file" id="photoFile" accept="image/*" onchange="uploadPhoto()" style="display:none;">
          <div class="photo-caption">Tap to change</div>
          <div id="photoMsg"></div>
        </div>
        <div class="profile-info">
          <h1 id="teacherName"></h1>
          <div class="profile-meta" id="profileMeta"></div>
          <div id="subjects"></div>
        </div>
      </div>
      <div class="field-grid">
        <strong>School</strong><span id="schoolName"></span>
        <strong>Class</strong><span id="className"></span>
        <strong>Email</strong><span id="email"></span>
      </div>
    </div>
  </div>
</div>
 
<script>
  const SUPABASE_URL = "https://qfjsgcyppbqilzfhkknj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvZGJ3a3R3Ymp5bmpzdXBmc3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDU1MTgsImV4cCI6MjEwNDE4MTUxOH0.K7C4k7FyN0hlniV51r6JQbzs_OObHFqXaShOxz6iGLs";
 
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function subjectTags(subjectString) {
    if (!subjectString) return '—';
    return subjectString.split(',').map(s => s.trim()).filter(Boolean)
      .map(s => '<span class="subject-tag">' + escapeHtml(s) + '</span>').join('');
  }
 
  let currentTeacher = null;
 
  async function loadTeacher() {
    const { data: { user } } = await supabaseClient.auth.getUser();
 
    if (!user) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notLoggedIn').style.display = 'block';
      return;
    }
 
    const { data, error } = await supabaseClient
      .from('teachers')
      .select('*')
      .eq('user_id', user.id)
      .maybeSingle();
 
    document.getElementById('loading').style.display = 'none';
 
    if (error) {
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('notLoggedIn').textContent = 'Could not load your account: ' + error.message;
      return;
    }
    if (!data) {
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('notLoggedIn').textContent = 'This login isn\'t linked to a teacher account. If you\'re a school admin, use dashboard.html instead.';
      return;
    }
 
    currentTeacher = data;
 
    let schoolLabel = '—';
    const { data: schoolData } = await supabaseClient
      .from('schools')
      .select('name')
      .eq('id', data.school_id)
      .maybeSingle();
    if (schoolData) schoolLabel = schoolData.name;
 
    document.getElementById('teacherName').textContent = data.name;
    document.getElementById('profileMeta').textContent = schoolLabel + (data.class_name ? ' · ' + data.class_name : '');
    document.getElementById('schoolName').textContent = schoolLabel;
    document.getElementById('className').textContent = data.class_name || '—';
    document.getElementById('email').textContent = data.email || '—';
    document.getElementById('subjects').innerHTML = subjectTags(data.subject);
 
    const photoCircle = document.getElementById('photoCircle');
    const editBadge = '<div class="photo-edit-badge">✎</div>';
    if (data.photo_url) {
      photoCircle.innerHTML = '<img src="' + data.photo_url + '" alt="Profile photo">' + editBadge;
    } else {
      const initials = (data.name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      photoCircle.innerHTML = '<span>' + (initials || '?') + '</span>' + editBadge;
    }
 
    if (data.theme_color) document.getElementById('sidebarEl').style.background = data.theme_color;
 
    document.getElementById('content').style.display = 'block';
  }
 
  async function uploadPhoto() {
    const fileInput = document.getElementById('photoFile');
    const msg = document.getElementById('photoMsg');
    if (!fileInput.files.length || !currentTeacher) return;
 
    const file = fileInput.files[0];
    const filePath = currentTeacher.user_id + '-' + Date.now() + '.' + file.name.split('.').pop();
 
    msg.textContent = 'Uploading…';
 
    const { error: uploadError } = await supabaseClient.storage
      .from('teacher-photos')
      .upload(filePath, file, { upsert: true });
 
    if (uploadError) {
      msg.textContent = 'Upload error: ' + uploadError.message;
      return;
    }
 
    const { data: urlData } = supabaseClient.storage.from('teacher-photos').getPublicUrl(filePath);
    const publicUrl = urlData.publicUrl;
 
    const { error: updateError } = await supabaseClient
      .from('teachers')
      .update({ photo_url: publicUrl })
      .eq('user_id', currentTeacher.user_id);
 
    if (updateError) {
      msg.textContent = 'Saved photo, but error linking it: ' + updateError.message;
      return;
    }
 
    currentTeacher.photo_url = publicUrl;
    document.getElementById('photoCircle').innerHTML = '<img src="' + publicUrl + '" alt="Profile photo"><div class="photo-edit-badge">✎</div>';
    msg.textContent = 'Photo updated.';
  }
 
  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  }
 
  loadTeacher();
</script>
 
 
<!-- Floating Quick Actions -->
<div class="fab-wrap no-print">
  <div class="fab-menu" id="fabMenu">
    <a class="fab-item" href="teacher-dashboard.html" style="--i:4"><span class="fab-emoji">🏠</span><span class="fab-label">Dashboard</span></a>
    <a class="fab-item" href="students.html#add-student" style="--i:3"><span class="fab-emoji">🧑‍🎓</span><span class="fab-label">Add Student</span></a>
    <a class="fab-item" href="assessments.html#create-assessment" style="--i:2"><span class="fab-emoji">📝</span><span class="fab-label">New Assessment</span></a>
    <a class="fab-item" href="students.html#add-student" style="--i:1"><span class="fab-emoji">👪</span><span class="fab-label">Add Parent (pick child)</span></a>
  </div>
  <button class="fab-main" id="fabMain" onclick="toggleFab()">
    <span id="fabIcon">✦</span>
    <span class="fab-badge hidden" id="fabBadge">0</span>
  </button>
</div>
 
<style>
  .fab-badge {
    position: absolute; top: -4px; right: -4px; background: var(--red, #EF4444); color: #FBFAF5;
    font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; padding: 0 5px;
    box-shadow: 0 0 0 2px var(--paper, #FFFFFF);
  }
  .fab-badge.hidden { display: none; }
  .fab-wrap { position: fixed; right: 22px; bottom: 26px; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; }
  .fab-main {
    position: relative;
    width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 30% 30%, #FFC24D, #FFB020);
    color: #FBFAF5; font-size: 26px; box-shadow: 0 4px 14px rgba(176,130,43,0.45);
    display: flex; align-items: center; justify-content: center;
    animation: fab-breathe 2.6s ease-in-out infinite;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .fab-main:hover { transform: scale(1.08); }
  .fab-wrap.open .fab-main { transform: rotate(135deg) scale(1.05); animation: none; }
  @keyframes fab-breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 4px 14px rgba(176,130,43,0.45); }
    50% { transform: scale(1.06); box-shadow: 0 6px 20px rgba(176,130,43,0.6); }
  }
 
  .fab-menu { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
  .fab-item {
    display: flex; align-items: center; gap: 10px; text-decoration: none;
    background: var(--sidebar-color, #2D6CDF); color: #FBFAF5; padding: 9px 16px 9px 9px;
    border-radius: 30px; box-shadow: 0 3px 10px rgba(22,40,58,0.28); font-size: 13px; font-weight: 500;
    opacity: 0; transform: translateY(14px) scale(0.7); pointer-events: none;
    transition: opacity 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    transition-delay: calc(var(--i) * 0.03s);
  }
  .fab-wrap.open .fab-item { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .fab-item:hover { filter: brightness(1.12); transform: translateY(0) scale(1.04); }
  .fab-emoji {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
 
  @keyframes target-pulse {
    0% { box-shadow: 0 0 0 0 rgba(176,130,43,0.55); }
    70% { box-shadow: 0 0 0 14px rgba(176,130,43,0); }
    100% { box-shadow: 0 0 0 0 rgba(176,130,43,0); }
  }
  .fab-target-highlight { animation: target-pulse 1.1s ease-out 2; }
 
  @media print { .fab-wrap { display: none !important; } }
</style>
 
<script>
  function toggleFab() {
    document.querySelector('.fab-wrap').classList.toggle('open');
    document.getElementById('fabIcon').textContent =
      document.querySelector('.fab-wrap').classList.contains('open') ? '×' : '✦';
  }
  document.addEventListener('click', function (e) {
    const wrap = document.querySelector('.fab-wrap');
    if (wrap.classList.contains('open') && !wrap.contains(e.target)) {
      wrap.classList.remove('open');
      document.getElementById('fabIcon').textContent = '✦';
    }
  });
  // On arrival via a #hash link, scroll to it and give it a friendly pulse.
  window.addEventListener('load', function () {
    if (window.location.hash) {
      const target = document.querySelector(window.location.hash);
      if (target) {
        setTimeout(function () {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('fab-target-highlight');
        }, 200);
      }
    }
  });
 
  // Notification badge: count of students in the teacher's own class flagged
  // by Early Warning (dropped since their previous assessment). Runs in its
  // own scope so it never collides with identifiers the page itself defines.
  (function () {
    var fabBands = [
      { min: 70, concern: false }, { min: 60, concern: false }, { min: 50, concern: false },
      { min: 40, concern: true }, { min: 0, concern: true }
    ];
    function fabGetBand(score) {
      var sorted = fabBands.slice().sort(function (a, b) { return b.min - a.min; });
      for (var i = 0; i < sorted.length; i++) if (score >= sorted[i].min) return sorted[i];
      return sorted[sorted.length - 1];
    }
    function fabAvg(scoreRows, topics) {
      var vals = scoreRows.filter(function (r) { return topics.indexOf(r.topic) !== -1; }).map(function (r) { return r.score; }).filter(function (v) { return v != null; });
      if (!vals.length) return null;
      return Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length);
    }
 
    async function updateFabBadge() {
      if (typeof supabaseClient === 'undefined') return;
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;
        const { data: teacher } = await supabaseClient.from('teachers').select('*').eq('user_id', user.id).maybeSingle();
        if (!teacher) return;
 
        const { data: assessmentRows } = await supabaseClient.from('assessments').select('*').eq('school_id', teacher.school_id).eq('class_name', teacher.class_name);
        const sorted = (assessmentRows || []).slice().sort(function (a, b) { return a.id - b.id; });
        if (sorted.length < 2) return;
 
        const latest = sorted[sorted.length - 1];
        const previous = sorted[sorted.length - 2];
        const latestTopics = latest.topics.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
        const prevTopics = previous.topics.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
 
        const { data: students } = await supabaseClient.from('students').select('id').eq('school_id', teacher.school_id).eq('class_name', teacher.class_name);
        const { data: latestScores } = await supabaseClient.from('scores').select('*').eq('assessment_id', latest.id);
        const { data: prevScores } = await supabaseClient.from('scores').select('*').eq('assessment_id', previous.id);
 
        var flaggedCount = 0;
        (students || []).forEach(function (s) {
          const currAvg = fabAvg((latestScores || []).filter(function (r) { return r.student_id === s.id; }), latestTopics);
          const prevAvg = fabAvg((prevScores || []).filter(function (r) { return r.student_id === s.id; }), prevTopics);
          if (currAvg !== null && prevAvg !== null && currAvg - prevAvg <= -5) flaggedCount++;
        });
 
        const badge = document.getElementById('fabBadge');
        if (flaggedCount > 0) {
          badge.textContent = flaggedCount;
          badge.classList.remove('hidden');
        }
      } catch (e) { /* badge is best-effort, fail silently */ }
    }
 
    updateFabBadge();
  })();
</script>
 
</body>
</html>
