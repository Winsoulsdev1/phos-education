<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PHOS AI Education — Teacher Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #EEF1EC; margin: 0; color: #1B2A3F; }
  .topbar { background: #1F4E5F; color: #FBFAF5; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  .topbar .brand { font-weight: 700; font-size: 15px; }
  .topbar nav a, .topbar nav button { color: #EAF1F0; text-decoration: none; font-size: 13px; margin-left: 18px; background: none; border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  .topbar nav a:hover, .topbar nav button:hover { background: rgba(255,255,255,0.12); }
  .page { max-width: 560px; margin: 32px auto; padding: 0 20px; }
  .card { background: #FBFAF5; border: 1px solid #D8D2BE; border-radius: 6px; padding: 26px; box-shadow: 0 1px 4px rgba(27,42,63,0.08); }
  h1 { font-size: 20px; color: #1F4E5F; margin: 0 0 16px; }
  .field-grid { display: grid; grid-template-columns: 120px 1fr; row-gap: 10px; font-size: 14px; }
  .field-grid strong { color: #4A5A6B; font-weight: 600; }
  .subject-tag { display: inline-block; background: #E1EBEA; color: #1F4E5F; font-size: 12px; padding: 2px 9px; border-radius: 10px; margin: 2px 4px 2px 0; }
  .photo-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .photo-circle { width: 60px; height: 60px; border-radius: 50%; background: #B0822B; color: #FBFAF5; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .photo-circle img { width: 100%; height: 100%; object-fit: cover; }
  .photo-msg { font-size: 11.5px; color: #4A5A6B; margin-top: 4px; }
  #loading, #notLoggedIn { text-align: center; color: #4A5A6B; padding: 60px 0; }
</style>
</head>
<body>
 
<div class="topbar">
  <div class="brand">PHOS AI Education</div>
  <nav>
    <a href="students.html">Students</a>
    <a href="assessments.html">Assessments</a>
    <button onclick="logout()">Log Out</button>
  </nav>
</div>
 
<div class="page">
  <div id="loading">Loading your account…</div>
  <div id="notLoggedIn" style="display:none;" class="card">
    You're not logged in. <a href="login.html">Go to login</a>
  </div>
  <div id="content" style="display:none;" class="card">
    <div class="photo-row">
      <div class="photo-circle" id="photoCircle">?</div>
      <div>
        <input type="file" id="photoFile" accept="image/*" onchange="uploadPhoto()">
        <div id="photoMsg" class="photo-msg"></div>
      </div>
    </div>
    <h1 id="teacherName"></h1>
    <div class="field-grid">
      <strong>School</strong><span id="schoolName"></span>
      <strong>Class</strong><span id="className"></span>
      <strong>Email</strong><span id="email"></span>
      <strong>Subjects</strong><span id="subjects"></span>
    </div>
  </div>
</div>
 
<script>
  const SUPABASE_URL = "https://rodbwktwbjynjsupfsvn.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvZGJ3a3R3Ymp5bmpzdXBmc3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDU1MTgsImV4cCI6MjEwNDE4MTUxOH0.K7C4k7FyN0hlniV51r6JQbzs_OObHFqXaShOxz6iGLs";
 
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function subjectTags(subjectString) {
    if (!subjectString) return '—';
    return subjectString.split(',').map(s => s.trim()).filter(Boolean)
      .map(s => '<span class="subject-tag">' + escapeHtml(s) + '</span>').join('');
  }
 
  let currentTeacher = null;
 
  async function loadTeacher() {
    const { data: { user } } = await supabaseClient.auth.getUser();
 
    if (!user) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notLoggedIn').style.display = 'block';
      return;
    }
 
    const { data, error } = await supabaseClient
      .from('teachers')
      .select('*')
      .eq('user_id', user.id)
      .maybeSingle();
 
    document.getElementById('loading').style.display = 'none';
 
    if (error) {
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('notLoggedIn').textContent = 'Could not load your account: ' + error.message;
      return;
    }
    if (!data) {
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('notLoggedIn').textContent = 'This login isn\'t linked to a teacher account. If you\'re a school admin, use dashboard.html instead.';
      return;
    }
 
    currentTeacher = data;
 
    let schoolLabel = '—';
    const { data: schoolData } = await supabaseClient
      .from('schools')
      .select('name')
      .eq('id', data.school_id)
      .maybeSingle();
    if (schoolData) schoolLabel = schoolData.name;
 
    document.getElementById('teacherName').textContent = data.name;
    document.getElementById('schoolName').textContent = schoolLabel;
    document.getElementById('className').textContent = data.class_name || '—';
    document.getElementById('email').textContent = data.email || '—';
    document.getElementById('subjects').innerHTML = subjectTags(data.subject);
 
    const photoCircle = document.getElementById('photoCircle');
    if (data.photo_url) {
      photoCircle.innerHTML = '<img src="' + data.photo_url + '" alt="Profile photo">';
    } else {
      const initials = (data.name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      photoCircle.textContent = initials || '?';
    }
 
    document.getElementById('content').style.display = 'block';
  }
 
  async function uploadPhoto() {
    const fileInput = document.getElementById('photoFile');
    const msg = document.getElementById('photoMsg');
    if (!fileInput.files.length || !currentTeacher) return;
 
    const file = fileInput.files[0];
    const filePath = currentTeacher.user_id + '-' + Date.now() + '.' + file.name.split('.').pop();
 
    msg.textContent = 'Uploading…';
 
    const { error: uploadError } = await supabaseClient.storage
      .from('teacher-photos')
      .upload(filePath, file, { upsert: true });
 
    if (uploadError) {
      msg.textContent = 'Upload error: ' + uploadError.message;
      return;
    }
 
    const { data: urlData } = supabaseClient.storage.from('teacher-photos').getPublicUrl(filePath);
    const publicUrl = urlData.publicUrl;
 
    const { error: updateError } = await supabaseClient
      .from('teachers')
      .update({ photo_url: publicUrl })
      .eq('user_id', currentTeacher.user_id);
 
    if (updateError) {
      msg.textContent = 'Saved photo, but error linking it: ' + updateError.message;
      return;
    }
 
    currentTeacher.photo_url = publicUrl;
    document.getElementById('photoCircle').innerHTML = '<img src="' + publicUrl + '" alt="Profile photo">';
    msg.textContent = 'Photo updated.';
  }
 
  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  }
 
  loadTeacher();
</script>
 
</body>
</html>
