<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PHOS AI Education — All Students</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16283A; --ink-soft: #5B6B7A; --sidebar-color: #17414F; --teal-tint: #E7EFEE;
    --gold: #B0822B; --sage: #4C7A63; --sage-tint: #E7F0EA;
    --red: #9C2C3C; --red-tint: #F5E4E4; --paper: #FDFBF6; --page-bg: #EEF0E9; --border: #E3DCC6;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", -apple-system, sans-serif; margin: 0; background: var(--page-bg); color: var(--ink); font-size: 13.5px; line-height: 1.5; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 210px; background: var(--sidebar-color); color: #DCEAE6; flex-shrink: 0; padding: 18px 0; }
  .brand { font-weight: 700; font-size: 14px; color: #FBFAF5; padding: 0 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 8px; letter-spacing: 0.2px; }
  .nav-item { display: block; padding: 10px 20px; font-size: 13px; color: #B9D3CB; text-decoration: none; border-left: 3px solid transparent; }
  .nav-item:hover { background: rgba(255,255,255,0.05); }
  .nav-item.active { background: rgba(255,255,255,0.08); border-left-color: var(--gold); color: #FBFAF5; font-weight: 600; }
  .logout-item { display: block; padding: 10px 20px; font-size: 12.5px; color: #E3A9A9; cursor: pointer; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
 
  .main { flex: 1; padding: 36px 40px; max-width: 760px; }
  .card { background: var(--paper); border-radius: 8px; padding: 24px 26px; box-shadow: 0 1px 3px rgba(22,40,58,0.06); border: 1px solid var(--border); }
  h1 { font-weight: 700; font-size: 20px; margin: 0 0 3px; }
  .subhead { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }
 
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type="text"], .toolbar select { flex: 1; min-width: 140px; padding: 9px; border: 1px solid var(--border); border-radius: 5px; font-size: 13px; background: #FFFEFB; }
 
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 6px; border-bottom: 2px solid var(--sidebar-color); color: var(--ink-soft); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.3px; }
  td { padding: 9px 6px; border-bottom: 1px solid #EFE9D6; }
  .student-name a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .student-name a:hover { text-decoration: underline; color: var(--sidebar-color); }
 
  #loading, #notLoggedIn { text-align: center; color: var(--ink-soft); padding: 60px 0; }
  .empty-note { font-size: 13px; color: var(--ink-soft); font-style: italic; padding: 8px 0; }
</style>
</head>
<body>
 
<div class="app">
  <div class="sidebar" id="sidebarEl">
    <div class="brand">PHOS AI Education</div>
    <a class="nav-item" href="dashboard.html">Dashboard</a>
    <a class="nav-item" href="teachers.html">Teachers</a>
    <a class="nav-item active" href="all-students.html">Students</a>
    <a class="nav-item" href="school-overview.html">School Overview</a>
    <div class="logout-item" onclick="logout()">Log Out</div>
  </div>
 
  <div class="main">
    <div id="loading">Loading…</div>
    <div id="notLoggedIn" style="display:none;" class="card">
      This page is for school admins only. <a href="login.html">Go to login</a>
    </div>
 
    <div id="content" style="display:none;" class="card">
      <h1>All Students</h1>
      <div class="subhead" id="schoolLabel"></div>
 
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search by name…" oninput="renderStudents()">
        <select id="classFilter" onchange="renderStudents()"></select>
      </div>
 
      <table>
        <thead><tr><th>Name</th><th>Class</th><th>Admission No.</th><th>Attendance</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="emptyNote" class="empty-note hidden">No students found.</div>
    </div>
  </div>
</div>
 
<script>
  const SUPABASE_URL = "https://rodbwktwbjynjsupfsvn.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvZGJ3a3R3Ymp5bmpzdXBmc3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDU1MTgsImV4cCI6MjEwNDE4MTUxOH0.K7C4k7FyN0hlniV51r6JQbzs_OObHFqXaShOxz6iGLs";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
  let currentSchool = null;
  let students = [];
 
  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
 
  async function init() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notLoggedIn').style.display = 'block';
      return;
    }
 
    const { data: school, error } = await supabaseClient.from('schools').select('*').eq('admin_user_id', user.id).maybeSingle();
 
    document.getElementById('loading').style.display = 'none';
 
    if (error || !school) {
      document.getElementById('notLoggedIn').style.display = 'block';
      return;
    }
 
    currentSchool = school;
    if (school.theme_color) document.getElementById('sidebarEl').style.background = school.theme_color;
    document.getElementById('schoolLabel').textContent = school.name;
    document.getElementById('content').style.display = 'block';
 
    await loadStudents();
  }
 
  async function loadStudents() {
    const { data, error } = await supabaseClient.from('students').select('*').eq('school_id', currentSchool.id);
    if (error) {
      document.getElementById('emptyNote').classList.remove('hidden');
      document.getElementById('emptyNote').textContent = 'Error loading students: ' + error.message;
      return;
    }
    students = data || [];
 
    const classNames = [...new Set(students.map(s => s.class_name).filter(Boolean))].sort();
    const classFilter = document.getElementById('classFilter');
    classFilter.innerHTML = '<option value="">All classes</option>' + classNames.map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>').join('');
 
    renderStudents();
  }
 
  function renderStudents() {
    const search = (document.getElementById('searchBox').value || '').toLowerCase();
    const classFilterVal = document.getElementById('classFilter').value;
 
    let list = students.filter(s =>
      s.name.toLowerCase().indexOf(search) !== -1 &&
      (!classFilterVal || s.class_name === classFilterVal)
    );
    list.sort((a, b) => a.name.localeCompare(b.name));
 
    const rows = document.getElementById('rows');
    const emptyNote = document.getElementById('emptyNote');
 
    if (!list.length) {
      rows.innerHTML = '';
      emptyNote.classList.remove('hidden');
      emptyNote.textContent = students.length ? 'No students match your search.' : 'No students found.';
      return;
    }
    emptyNote.classList.add('hidden');
 
    rows.innerHTML = list.map(s =>
      '<tr>' +
        '<td class="student-name"><a href="student-profile.html?id=' + s.id + '">' + escapeHtml(s.name) + '</a></td>' +
        '<td>' + escapeHtml(s.class_name || '—') + '</td>' +
        '<td>' + escapeHtml(s.admission_number || '—') + '</td>' +
        '<td>' + (s.attendance != null ? s.attendance + '%' : '—') + '</td>' +
      '</tr>'
    ).join('');
  }
 
  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  }
 
  init();
</script>
 
</body>
</html>
