<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchoolOS — Teachers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E293B; --ink-soft: #64748B; --sidebar-color: #2D6CDF; --teal-tint: #E3EEFF;
    --gold: #FFB020; --sage: #22A06B; --sage-tint: #E1F8ED;
    --red: #EF4444; --red-tint: #FDE8E8; --paper: #FFFFFF; --page-bg: #EFF3FF; --border: #DCE6FA;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", -apple-system, sans-serif; margin: 0; background: var(--page-bg); color: var(--ink); font-size: 13.5px; line-height: 1.5; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 210px; background: var(--sidebar-color); color: #DCEAE6; flex-shrink: 0; padding: 18px 0; }
  .brand { font-weight: 700; font-size: 14px; color: #FBFAF5; padding: 0 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 8px; letter-spacing: 0.2px; }
  .nav-item { display: block; padding: 10px 20px; font-size: 13px; color: #B9D3CB; text-decoration: none; border-left: 3px solid transparent; }
  .nav-item:hover { background: rgba(255,255,255,0.05); }
  .nav-item.active { background: rgba(255,255,255,0.08); border-left-color: var(--gold); color: #FBFAF5; font-weight: 600; }
  .logout-item { display: block; padding: 10px 20px; font-size: 12.5px; color: #E3A9A9; cursor: pointer; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
 
  .main { flex: 1; padding: 36px 40px; max-width: 680px; }
  .card { background: var(--paper); border-radius: 8px; padding: 24px 26px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(22,40,58,0.06); border: 1px solid var(--border); }
  h1 { font-weight: 700; font-size: 20px; margin: 0 0 16px; }
 
  label { display: block; font-size: 13px; margin: 12px 0 4px; }
  input { width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 5px; font-size: 14px; background: #FFFEFB; }
 
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 6px; border-bottom: 2px solid var(--sidebar-color); color: var(--ink-soft); font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; }
  td { padding: 8px 6px; border-bottom: 1px solid #EFE9D6; }
  .subject-tag {
    display: inline-block; background: var(--teal-tint); color: var(--sidebar-color); font-size: 11px;
    padding: 2px 8px; border-radius: 10px; margin: 2px 3px 2px 0;
  }
 
  button.btn-primary { background: var(--sidebar-color); color: var(--paper); border: none; padding: 10px 16px; border-radius: 5px; cursor: pointer; font-size: 13px; margin-top: 18px; font-weight: 500; }
  #teacherMsg { margin-top: 12px; font-size: 13px; padding: 8px 10px; border-radius: 5px; display: none; }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 60px; }
  .toggle-eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--sidebar-color); font-size: 12px; cursor: pointer; padding: 4px 6px;
  }
  #teacherMsg.success { background: var(--sage-tint); color: #2E4F41; display: block; }
  #teacherMsg.error { background: var(--red-tint); color: #6E1F2A; display: block; }
  #loading, #notLoggedIn { text-align: center; color: var(--ink-soft); padding: 60px 0; }
  .empty-note { font-size: 13px; color: var(--ink-soft); font-style: italic; padding: 10px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
 
<div class="app">
  <div class="sidebar" id="sidebarEl">
    <div class="brand">SchoolOS</div>
    <a class="nav-item" href="dashboard.html">Dashboard</a>
    <a class="nav-item active" href="teachers.html">Teachers</a>
    <a class="nav-item" href="all-students.html">Students</a>
    <a class="nav-item" href="school-overview.html">School Overview</a>
    <div class="logout-item" onclick="logout()">Log Out</div>
  </div>
 
  <div class="main">
    <div id="loading">Loading…</div>
    <div id="notLoggedIn" style="display:none;" class="card">
      You're not logged in. <a href="login.html">Go to login</a>
    </div>
 
    <div id="content" style="display:none;">
      <div class="card">
        <h1>Teachers</h1>
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Class</th><th>Subjects</th></tr></thead>
          <tbody id="teacherRows"></tbody>
        </table>
        <div id="emptyNote" class="empty-note hidden">No teachers added yet.</div>
      </div>
 
      <div class="card" id="add-teacher">
        <h1>Add a Teacher</h1>
        <label>Teacher's name</label>
        <input id="t_name" placeholder="e.g. Mrs. Adebayo">
        <label>Email</label>
        <input id="t_email" placeholder="teacher@school.com">
        <label>Phone</label>
        <input id="t_phone" placeholder="Optional">
        <label>Subject(s)</label>
        <input id="t_subject" placeholder="e.g. Mathematics, Physics">
        <label>Class taught</label>
        <input id="t_class" placeholder="e.g. JSS1">
        <label>Temporary password</label>
        <div class="password-wrap">
          <input id="t_password" type="password" placeholder="Give this to the teacher">
          <button type="button" class="toggle-eye" onclick="toggleEye('t_password', this)">Show</button>
        </div>
        <button class="btn-primary" id="addTeacherBtn" onclick="addTeacher()">Add Teacher</button>
        <div id="teacherMsg"></div>
      </div>
    </div>
  </div>
</div>
 
<script>
  const SUPABASE_URL = "https://rodbwktwbjynjsupfsvn.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvZGJ3a3R3Ymp5bmpzdXBmc3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDU1MTgsImV4cCI6MjEwNDE4MTUxOH0.K7C4k7FyN0hlniV51r6JQbzs_OObHFqXaShOxz6iGLs";
 
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
  const supabaseAdminAction = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, storageKey: 'schoolos-isolated-action' }
  });
 
  let currentSchool = null;
 
  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function subjectTags(subjectString) {
    if (!subjectString) return '—';
    return subjectString.split(',').map(s => s.trim()).filter(Boolean)
      .map(s => '<span class="subject-tag">' + escapeHtml(s) + '</span>').join('');
  }
 
  async function init() {
    const { data: { user } } = await supabaseClient.auth.getUser();
 
    if (!user) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notLoggedIn').style.display = 'block';
      return;
    }
 
    const { data, error } = await supabaseClient
      .from('schools')
      .select('*')
      .eq('admin_user_id', user.id)
      .maybeSingle();
 
    document.getElementById('loading').style.display = 'none';
 
    if (error) {
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('notLoggedIn').innerHTML = 'Could not load your school: ' + error.message + ' <a href="login.html">Go to login</a>';
      return;
    }
    if (!data) {
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('notLoggedIn').innerHTML = 'Logged in, but this login isn\'t linked to a school admin account. <a href="login.html">Go to login</a>';
      return;
    }
 
    currentSchool = data;
    document.getElementById('content').style.display = 'block';
    loadTeachers();
  }
 
  async function loadTeachers() {
    const { data, error } = await supabaseClient
      .from('teachers')
      .select('*')
      .eq('school_id', currentSchool.id);
 
    const rows = document.getElementById('teacherRows');
    rows.innerHTML = '';
    const emptyNote = document.getElementById('emptyNote');
 
    if (error) {
      emptyNote.classList.remove('hidden');
      emptyNote.textContent = 'Error loading teachers: ' + error.message;
      return;
    }
    if (!data || !data.length) {
      emptyNote.classList.remove('hidden');
      emptyNote.textContent = 'No teachers added yet.';
      return;
    }
    emptyNote.classList.add('hidden');
 
    data.forEach(t => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + escapeHtml(t.name) + '</td><td>' + escapeHtml(t.email) + '</td><td>' + escapeHtml(t.class_name || '—') + '</td><td>' + subjectTags(t.subject) + '</td>';
      rows.appendChild(tr);
    });
  }
 
  function toggleEye(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Hide'; }
    else { input.type = 'password'; btn.textContent = 'Show'; }
  }
 
  async function addTeacher() {
    const name = document.getElementById('t_name').value.trim();
    const email = document.getElementById('t_email').value.trim();
    const phone = document.getElementById('t_phone').value.trim();
    const subject = document.getElementById('t_subject').value.trim();
    const class_name = document.getElementById('t_class').value.trim();
    const password = document.getElementById('t_password').value;
    const msg = document.getElementById('teacherMsg');
 
    if (!name || !email || !password) {
      msg.className = 'error';
      msg.textContent = 'Name, email, and a temporary password are required.';
      return;
    }
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
      msg.className = 'error';
      msg.textContent = 'Please enter a valid email address.';
      return;
    }
 
    const btn = document.getElementById('addTeacherBtn');
    btn.disabled = true;
    btn.textContent = 'Adding…';
 
    const { data: authData, error: authError } = await supabaseAdminAction.auth.signUp({ email, password });
 
    if (authError) {
      btn.disabled = false;
      btn.textContent = 'Add Teacher';
      msg.className = 'error';
      msg.textContent = 'Error creating login: ' + authError.message;
      return;
    }
 
    const { error } = await supabaseClient
      .from('teachers')
      .insert([{ school_id: currentSchool.id, user_id: authData.user.id, name, email, phone, subject, class_name }]);
 
    btn.disabled = false;
    btn.textContent = 'Add Teacher';
 
    if (error) {
      msg.className = 'error';
      msg.textContent = 'Error saving teacher: ' + error.message;
      return;
    }
 
    msg.className = 'success';
    msg.textContent = 'Teacher added! Give them their email and temporary password to log in.';
    document.getElementById('t_name').value = '';
    document.getElementById('t_email').value = '';
    document.getElementById('t_phone').value = '';
    document.getElementById('t_subject').value = '';
    document.getElementById('t_class').value = '';
    document.getElementById('t_password').value = '';
    loadTeachers();
  }
 
  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  }
 
  init();
</script>
 
 
<!-- Floating Quick Actions -->
<div class="fab-wrap no-print">
  <div class="fab-menu" id="fabMenu">
    <a class="fab-item" href="dashboard.html" style="--i:4"><span class="fab-emoji">🏫</span><span class="fab-label">Dashboard</span></a>
    <a class="fab-item" href="teachers.html#add-teacher" style="--i:3"><span class="fab-emoji">🧑‍🏫</span><span class="fab-label">Add Teacher</span></a>
    <a class="fab-item" href="all-students.html" style="--i:2"><span class="fab-emoji">🧑‍🎓</span><span class="fab-label">Students</span></a>
    <a class="fab-item" href="school-overview.html" style="--i:1"><span class="fab-emoji">📈</span><span class="fab-label">School Overview</span></a>
  </div>
  <button class="fab-main" id="fabMain" onclick="toggleFab()">
    <span id="fabIcon">✦</span>
    <span class="fab-badge hidden" id="fabBadge">0</span>
  </button>
</div>
 
<style>
  .fab-badge {
    position: absolute; top: -4px; right: -4px; background: var(--red, #EF4444); color: #FBFAF5;
    font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; padding: 0 5px;
    box-shadow: 0 0 0 2px var(--paper, #FFFFFF);
  }
  .fab-badge.hidden { display: none; }
  .fab-wrap { position: fixed; right: 22px; bottom: 26px; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; }
  .fab-main {
    position: relative;
    width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 30% 30%, #FFC24D, #FFB020);
    color: #FBFAF5; font-size: 26px; box-shadow: 0 4px 14px rgba(176,130,43,0.45);
    display: flex; align-items: center; justify-content: center;
    animation: fab-breathe 2.6s ease-in-out infinite;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .fab-main:hover { transform: scale(1.08); }
  .fab-wrap.open .fab-main { transform: rotate(135deg) scale(1.05); animation: none; }
  @keyframes fab-breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 4px 14px rgba(176,130,43,0.45); }
    50% { transform: scale(1.06); box-shadow: 0 6px 20px rgba(176,130,43,0.6); }
  }
 
  .fab-menu { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
  .fab-item {
    display: flex; align-items: center; gap: 10px; text-decoration: none;
    background: var(--sidebar-color, #2D6CDF); color: #FBFAF5; padding: 9px 16px 9px 9px;
    border-radius: 30px; box-shadow: 0 3px 10px rgba(22,40,58,0.28); font-size: 13px; font-weight: 500;
    opacity: 0; transform: translateY(14px) scale(0.7); pointer-events: none;
    transition: opacity 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    transition-delay: calc(var(--i) * 0.03s);
  }
  .fab-wrap.open .fab-item { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .fab-item:hover { filter: brightness(1.12); transform: translateY(0) scale(1.04); }
  .fab-emoji {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
 
  @keyframes target-pulse {
    0% { box-shadow: 0 0 0 0 rgba(176,130,43,0.55); }
    70% { box-shadow: 0 0 0 14px rgba(176,130,43,0); }
    100% { box-shadow: 0 0 0 0 rgba(176,130,43,0); }
  }
  .fab-target-highlight { animation: target-pulse 1.1s ease-out 2; }
 
  @media print { .fab-wrap { display: none !important; } }
</style>
 
<script>
  function toggleFab() {
    document.querySelector('.fab-wrap').classList.toggle('open');
    document.getElementById('fabIcon').textContent =
      document.querySelector('.fab-wrap').classList.contains('open') ? '×' : '✦';
  }
  document.addEventListener('click', function (e) {
    const wrap = document.querySelector('.fab-wrap');
    if (wrap.classList.contains('open') && !wrap.contains(e.target)) {
      wrap.classList.remove('open');
      document.getElementById('fabIcon').textContent = '✦';
    }
  });
  window.addEventListener('load', function () {
    if (window.location.hash) {
      const target = document.querySelector(window.location.hash);
      if (target) {
        setTimeout(function () {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('fab-target-highlight');
        }, 200);
      }
    }
  });
 
  // Notification badge: school-wide count of students flagged by Early
  // Warning, across every class. Self-contained scope to avoid colliding
  // with identifiers the page itself already defines.
  (function () {
    var fabBands = [
      { min: 70, concern: false }, { min: 60, concern: false }, { min: 50, concern: false },
      { min: 40, concern: true }, { min: 0, concern: true }
    ];
    function fabAvg(scoreRows, topics) {
      var vals = scoreRows.filter(function (r) { return topics.indexOf(r.topic) !== -1; }).map(function (r) { return r.score; }).filter(function (v) { return v != null; });
      if (!vals.length) return null;
      return Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length);
    }
 
    async function updateFabBadge() {
      if (typeof supabaseClient === 'undefined') return;
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;
        const { data: school } = await supabaseClient.from('schools').select('*').eq('admin_user_id', user.id).maybeSingle();
        if (!school) return;
 
        const [{ data: students }, { data: assessments }, { data: scores }] = await Promise.all([
          supabaseClient.from('students').select('*').eq('school_id', school.id),
          supabaseClient.from('assessments').select('*').eq('school_id', school.id),
          supabaseClient.from('scores').select('*').eq('school_id', school.id)
        ]);
 
        const classNames = [...new Set((students || []).map(function (s) { return s.class_name; }).filter(Boolean))];
        var flaggedCount = 0;
 
        classNames.forEach(function (className) {
          const classAssessments = (assessments || []).filter(function (a) { return a.class_name === className; }).sort(function (a, b) { return a.id - b.id; });
          if (classAssessments.length < 2) return;
          const latest = classAssessments[classAssessments.length - 1];
          const previous = classAssessments[classAssessments.length - 2];
          const latestTopics = latest.topics.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
          const prevTopics = previous.topics.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
 
          (students || []).filter(function (s) { return s.class_name === className; }).forEach(function (s) {
            const currAvg = fabAvg((scores || []).filter(function (r) { return r.assessment_id === latest.id && r.student_id === s.id; }), latestTopics);
            const prevAvg = fabAvg((scores || []).filter(function (r) { return r.assessment_id === previous.id && r.student_id === s.id; }), prevTopics);
            if (currAvg !== null && prevAvg !== null && currAvg - prevAvg <= -5) flaggedCount++;
          });
        });
 
        const badge = document.getElementById('fabBadge');
        if (flaggedCount > 0) {
          badge.textContent = flaggedCount;
          badge.classList.remove('hidden');
        }
      } catch (e) { /* badge is best-effort, fail silently */ }
    }
 
    updateFabBadge();
  })();
</script>
 
</body>
</html>
