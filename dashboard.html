<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PHOS AI Education — School Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16283A; --ink-soft: #5B6B7A; --sidebar-color: #17414F; --teal-tint: #E7EFEE;
    --gold: #B0822B; --sage: #4C7A63; --sage-tint: #E7F0EA;
    --red: #9C2C3C; --red-tint: #F5E4E4; --paper: #FDFBF6; --page-bg: #EEF0E9; --border: #E3DCC6;
  }
  * { box-sizing: border-box; }
  body { font-family: "Inter", -apple-system, sans-serif; margin: 0; background: var(--page-bg); color: var(--ink); font-size: 14px; line-height: 1.5; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 210px; background: var(--sidebar-color); color: #DCEAE6; flex-shrink: 0; padding: 18px 0; }
  .brand { font-weight: 700; font-size: 14px; color: #FBFAF5; padding: 0 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 8px; letter-spacing: 0.2px; }
  .nav-item { display: block; padding: 10px 20px; font-size: 13px; color: #B9D3CB; text-decoration: none; border-left: 3px solid transparent; }
  .nav-item:hover { background: rgba(255,255,255,0.05); }
  .nav-item.active { background: rgba(255,255,255,0.08); border-left-color: var(--gold); color: #FBFAF5; font-weight: 600; }
  .logout-item { display: block; padding: 10px 20px; font-size: 12.5px; color: #E3A9A9; cursor: pointer; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
 
  .main { flex: 1; padding: 36px 40px; max-width: 640px; }
  .card { background: var(--paper); border-radius: 8px; padding: 28px 30px; box-shadow: 0 1px 3px rgba(22,40,58,0.06); border: 1px solid var(--border); }
  h1 { font-weight: 700; font-size: 21px; margin: 0 0 18px; }
  .field-grid { display: grid; grid-template-columns: 130px 1fr; row-gap: 12px; font-size: 14px; }
  .field-grid strong { color: var(--ink-soft); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; }
 
  label { display: block; font-size: 13px; margin: 12px 0 4px; }
  input { width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 5px; font-size: 14px; background: #FFFEFB; }
 
  .row { display: flex; gap: 10px; margin-top: 18px; }
  button.btn-primary { background: var(--sidebar-color); color: var(--paper); border: none; padding: 9px 16px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500; }
  button.btn-outline { background: none; border: 1px solid var(--sidebar-color); color: var(--sidebar-color); padding: 9px 16px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500; }
 
  #loading, #notLoggedIn { text-align: center; color: var(--ink-soft); padding: 60px 0; }
  #editMsg { margin-top: 12px; font-size: 13px; padding: 8px 10px; border-radius: 5px; display: none; }
  #editMsg.success { background: var(--sage-tint); color: #2E4F41; display: block; }
  #editMsg.error { background: var(--red-tint); color: #6E1F2A; display: block; }
  .hidden { display: none; }
</style>
</head>
<body>
 
<div class="app">
  <div class="sidebar" id="sidebarEl">
    <div class="brand">PHOS AI Education</div>
    <a class="nav-item active" href="dashboard.html">Dashboard</a>
    <a class="nav-item" href="teachers.html">Teachers</a>
    <a class="nav-item" href="all-students.html">Students</a>
    <a class="nav-item" href="school-overview.html">School Overview</a>
    <div class="logout-item" onclick="logout()">Log Out</div>
  </div>
 
  <div class="main">
    <div id="loading">Loading your school…</div>
    <div id="notLoggedIn" style="display:none;" class="card">
      You're not logged in. <a href="login.html">Go to login</a>
    </div>
 
    <div id="dashboardContent" style="display:none;" class="card">
 
      <div id="viewMode">
        <h1 id="schoolName"></h1>
        <div class="field-grid">
          <strong>Address</strong><span id="schoolAddress"></span>
          <strong>Contact email</strong><span id="schoolEmail"></span>
          <strong>Contact phone</strong><span id="schoolPhone"></span>
        </div>
        <div class="row">
          <button class="btn-outline" onclick="startEdit()">Edit School Info</button>
        </div>
      </div>
 
      <div id="editModeBox" class="hidden">
        <h1>Edit School Info</h1>
        <label>School name</label>
        <input id="edit_name">
        <label>Address</label>
        <input id="edit_address">
        <label>Contact email</label>
        <input id="edit_contact_email">
        <label>Contact phone</label>
        <input id="edit_contact_phone">
        <div class="row">
          <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
          <button class="btn-outline" onclick="cancelEdit()">Cancel</button>
        </div>
        <div id="editMsg"></div>
      </div>
 
    </div>
  </div>
</div>
 
<script>
  const SUPABASE_URL = "https://rodbwktwbjynjsupfsvn.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvZGJ3a3R3Ymp5bmpzdXBmc3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDU1MTgsImV4cCI6MjEwNDE4MTUxOH0.K7C4k7FyN0hlniV51r6JQbzs_OObHFqXaShOxz6iGLs";
 
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
 
  let currentSchool = null;
 
  async function loadDashboard() {
    const { data: { user } } = await supabaseClient.auth.getUser();
 
    if (!user) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('notLoggedIn').style.display = 'block';
      return;
    }
 
    const { data, error } = await supabaseClient
      .from('schools')
      .select('*')
      .eq('admin_user_id', user.id)
      .maybeSingle();
 
    document.getElementById('loading').style.display = 'none';
 
    if (error) {
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('notLoggedIn').textContent = 'Could not load your school: ' + error.message;
      return;
    }
    if (!data) {
      document.getElementById('notLoggedIn').style.display = 'block';
      document.getElementById('notLoggedIn').textContent = 'This login isn\'t linked to a school admin account.';
      return;
    }
 
    currentSchool = data;
    renderView();
    document.getElementById('dashboardContent').style.display = 'block';
  }
 
  function renderView() {
    document.getElementById('schoolName').textContent = currentSchool.name;
    document.getElementById('schoolAddress').textContent = currentSchool.address || '—';
    document.getElementById('schoolEmail').textContent = currentSchool.contact_email || '—';
    document.getElementById('schoolPhone').textContent = currentSchool.contact_phone || '—';
  }
 
  function startEdit() {
    document.getElementById('edit_name').value = currentSchool.name || '';
    document.getElementById('edit_address').value = currentSchool.address || '';
    document.getElementById('edit_contact_email').value = currentSchool.contact_email || '';
    document.getElementById('edit_contact_phone').value = currentSchool.contact_phone || '';
    document.getElementById('viewMode').classList.add('hidden');
    document.getElementById('editModeBox').classList.remove('hidden');
  }
 
  function cancelEdit() {
    document.getElementById('viewMode').classList.remove('hidden');
    document.getElementById('editModeBox').classList.add('hidden');
    document.getElementById('editMsg').style.display = 'none';
  }
 
  async function saveEdit() {
    const name = document.getElementById('edit_name').value.trim();
    const address = document.getElementById('edit_address').value.trim();
    const contact_email = document.getElementById('edit_contact_email').value.trim();
    const contact_phone = document.getElementById('edit_contact_phone').value.trim();
    const msg = document.getElementById('editMsg');
 
    if (!name || !contact_email) {
      msg.className = 'error';
      msg.textContent = 'School name and contact email are required.';
      return;
    }
 
    const { data: { user } } = await supabaseClient.auth.getUser();
 
    const { error } = await supabaseClient
      .from('schools')
      .update({ name, address, contact_email, contact_phone })
      .eq('admin_user_id', user.id);
 
    if (error) {
      msg.className = 'error';
      msg.textContent = 'Error saving: ' + error.message;
      return;
    }
 
    currentSchool = { ...currentSchool, name, address, contact_email, contact_phone };
    renderView();
    msg.className = 'success';
    msg.textContent = 'Saved!';
    setTimeout(cancelEdit, 800);
  }
 
  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  }
 
  loadDashboard();
</script>
 
</body>
</html>
